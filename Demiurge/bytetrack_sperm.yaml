# ByteTrack 优化配置 —— 针对精子密集小目标快速运动场景
# 基于 ultralytics 默认 bytetrack.yaml 调整
tracker_type: bytetrack

# 第一阶段匹配阈值：高置信度检测用于轨迹匹配和初始化。
# 默认0.25已适合精子小目标（置信度普遍不高），保持不变。
track_high_thresh: 0.25

# 第二阶段低置信度匹配阈值：低分检测框用于二次匹配，恢复被遮挡目标。
# 默认0.1保持不变。
track_low_thresh: 0.1

# 新轨迹初始化阈值：未匹配的检测框置信度≥此值才创建新轨迹。
# 默认0.25保持不变，减少虚假轨迹。
new_track_thresh: 0.25

# 跟踪缓冲帧数：目标消失后保留轨迹ID的帧数。
# 默认30帧（约1.5秒@20fps），精子运动快易短暂离开画面，
# 增加到80帧（约4秒）减少ID频繁切换。
track_buffer: 80

# 匹配相似度阈值：帧间IoU/代价匹配阈值，高于此值才认为是同一目标。
# 默认0.8过高，精子帧间位移大，降到0.65提升匹配成功率，减少ID切换。
match_thresh: 0.65

# 融合检测分数与运动/IoU进行匹配，稳定弱检测目标。保持开启。
fuse_score: True
